name: Guess My Number

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  play:
    if: startsWith(github.event.issue.title, 'guess:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title;
            const guess = parseInt(title.replace(/^guess:\s*/, ''), 10);

            if (!Number.isInteger(guess) || guess < 1 || guess > 100) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: "That's not a number between 1 and 100. Edit the issue title to `guess: 42` (any number 1-100).",
              });
              return;
            }

            // Secret derives from the ISO week, so it changes every Monday and is
            // identical for every player that week. Not cryptographic — it's a game.
            const now = new Date();
            const week = Math.floor((now - new Date(now.getFullYear(), 0, 1)) / 604800000);
            let h = Math.imul(now.getFullYear() * 53 + week, 2654435761) >>> 0;
            h ^= h >>> 15;
            h = Math.imul(h, 2246822507) >>> 0;
            h = (h ^ (h >>> 13)) >>> 0;
            const secret = (h % 100) + 1;

            // Count how many guesses this player has already made in this thread.
            const comments = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const attempts = comments.data.filter(c => c.user.type === 'Bot').length + 1;
            const left = 7 - attempts;

            let body;
            if (guess === secret) {
              body = `🎉 **${secret}.** Got it in ${attempts} ${attempts === 1 ? 'guess' : 'guesses'}.\n\n`
                   + `Nice. New number every Monday — come back then.`;
              await github.rest.issues.addLabels({
                ...context.repo, issue_number: context.issue.number, labels: ['solved'],
              });
            } else if (left <= 0) {
              body = `Out of guesses — it was **${secret}**. New number every Monday.`;
            } else {
              const dir = guess < secret ? '**higher** ⬆️' : '**lower** ⬇️';
              body = `${guess}? Go ${dir}\n\n`
                   + `${left} ${left === 1 ? 'guess' : 'guesses'} left. `
                   + `Edit the issue title to guess again.`;
            }

            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number, body,
            });

            if (guess === secret || left <= 0) {
              await github.rest.issues.update({
                ...context.repo, issue_number: context.issue.number, state: 'closed',
              });
            }
