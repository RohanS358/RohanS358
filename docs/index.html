<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>RUN — rohan</title>
<meta name="description" content="A tiny endless runner. Jump the cacti, duck the birds.">
<style>
  :root{
    --bg:#0e0e12; --fg:#e8e8ef; --dim:#6a6a7a; --accent:#7cf03d; --danger:#ff4d6d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--fg);
    font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    overflow:hidden;
    -webkit-user-select:none; user-select:none; touch-action:manipulation;
  }
  h1{
    position:fixed; top:14px; left:20px; z-index:2;
    margin:0; font-size:13px; font-weight:600; letter-spacing:.32em;
    color:var(--dim); text-transform:uppercase; pointer-events:none;
  }
  #wrap{position:fixed; inset:0}
  canvas{
    display:block; width:100%; height:100%;
    background:#111117;
  }
  #hint{
    position:fixed; left:0; right:0; bottom:14px; z-index:2;
    color:var(--dim); font-size:12px; text-align:center;
  }
  #hint.top{bottom:auto; top:14px; right:20px; left:auto; text-align:right}
  kbd{
    background:#1c1c26; border:1px solid #2e2e3c; border-bottom-width:2px;
    border-radius:4px; padding:1px 5px; font:inherit; font-size:11px; color:var(--fg);
  }
  a{color:var(--dim)}
  a:hover{color:var(--accent)}
  @media (max-width:600px){ #hint .desktop{display:none} }
  @media (min-width:601px){ #hint .touch{display:none} }
</style>
</head>
<body>

<h1>run</h1>
<div id="wrap"><canvas id="c" width="760" height="240"></canvas></div>
<div id="hint">
  <span class="desktop"><kbd>space</kbd> jump · <kbd>space</kbd> again to double jump · <kbd>shift</kbd> dash · <kbd>↓</kbd> duck</span>
  <span class="touch">tap jump · tap again mid-air to double jump · swipe → to dash · hold low to duck</span>
  &nbsp;·&nbsp; <a href="https://github.com/RohanS358">← profile</a>
</div>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');

  // Canvas fills the viewport. W/H/GROUND are recomputed on resize, so every
  // system below reads them live rather than capturing a size at startup.
  let W = 0, H = 0, GROUND = 0, DPR = 1;
  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2);   // cap: 3x on phones costs more than it shows
    W = Math.round(innerWidth);
    H = Math.round(innerHeight);
    cv.width  = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.imageSmoothingEnabled = false;
    // Keep the floor a fixed distance up from the bottom, but never so low on
    // short/landscape phones that the play area vanishes.
    GROUND = Math.round(H - Math.max(56, Math.min(150, H * 0.22)));
  }
  addEventListener('resize', resize);
  addEventListener('orientationchange', resize);
  resize();

  // ---- tuning -------------------------------------------------------------
  const GRAV      = 2400;   // px/s^2
  const JUMP_V    = -700;   // initial jump velocity
  const CUT       = 0.42;   // velocity kept when jump released early (variable height)
  const COYOTE    = 0.08;   // s of forgiveness after leaving ground
  const BUFFER    = 0.10;   // s of jump-input buffering before landing
  const SPD0      = 320;    // starting scroll speed px/s
  const SPD_MAX   = 760;
  const SPD_ACC   = 11;     // px/s per second
  const AIR_JUMP_V= -620;   // double jump: slightly weaker than the first
  const DASH_V    = 900;    // dash speed (world units, moves obstacles past you)
  const DASH_TIME = 0.18;   // s of dash
  const DASH_CD   = 0.9;    // s cooldown

  const best = (() => {
    try { return parseInt(localStorage.getItem('run.best') || '0', 10) || 0; }
    catch { return 0; }   // private mode / blocked storage
  })();

  let S;
  function reset() {
    S = {
      t:0, spd:SPD0, dist:0, score:0, best,
      y:GROUND, vy:0, ducking:false, onGround:true,
      coyote:0, buffer:0, jumpHeld:false,
      jumps:0,              // air jumps used since last grounded
      dashT:0, dashCd:0, dashDir:0,
      bombs:[], blasts:[], tier:1, tierMsg:0,
      obs:[], plats:[], nextGap:60, nextPlat:340, clouds:[], parts:[],
      surf:GROUND,          // surface currently standing on / falling toward
      state:'ready',        // ready | run | dead
      deadT:0, shake:0,
    };
    const nClouds = Math.max(5, Math.round(W/170));
    for (let i=0;i<nClouds;i++) S.clouds.push({
      x:Math.random()*W, y:20+Math.random()*Math.max(60, GROUND*0.45), s:.25+Math.random()*.35
    });
  }
  reset();

  // ---- input --------------------------------------------------------------
  const press = () => {
    if (S.state === 'ready') { S.state = 'run'; return; }
    if (S.state === 'dead')  { if (S.deadT > .5) { const b=S.best; reset(); S.best=b; S.state='run'; } return; }
    S.buffer = BUFFER; S.jumpHeld = true;
    // Double jump: only once airborne with no ground/coyote left to use.
    if (!S.onGround && S.coyote <= 0 && S.jumps < 1) {
      S.jumps++; S.vy = AIR_JUMP_V; S.buffer = 0;
      for (let i=0;i<8;i++) S.parts.push({
        x:52, y:S.y-6, vx:(Math.random()-.5)*140, vy:Math.random()*120, life:.5, c:'#7cf03d'
      });
    }
  };

  const dash = () => {
    if (S.state !== 'run' || S.dashCd > 0 || S.dashT > 0) return;
    S.dashT = DASH_TIME; S.dashCd = DASH_CD;
    for (let i=0;i<10;i++) S.parts.push({
      x:44, y:S.y-20+Math.random()*20, vx:-200-Math.random()*200, vy:(Math.random()-.5)*60,
      life:.45, c:'#7cf03d'
    });
  };
  const release = () => {
    S.jumpHeld = false;
    if (S.vy < 0) S.vy *= CUT;          // variable jump height
  };

  addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); if(!e.repeat) press(); }
    if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); S.ducking = true; }
    if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyD') { e.preventDefault(); if(!e.repeat) dash(); }
  });
  addEventListener('keyup', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') release();
    if (e.code === 'ArrowDown' || e.code === 'KeyS') S.ducking = false;
  });
  let tStart = null;
  cv.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0];
    tStart = {x:t.clientX, y:t.clientY, t:performance.now()};
    // Bottom fifth is the duck pad; anywhere else jumps.
    if (t.clientY > innerHeight * 0.8 && S.state === 'run') S.ducking = true;
    else press();
  }, {passive:false});
  cv.addEventListener('touchmove', e => {
    if (!tStart) return;
    const t = e.touches[0];
    // A quick rightward flick is a dash.
    if (t.clientX - tStart.x > 48 && performance.now() - tStart.t < 300) { dash(); tStart = null; }
  }, {passive:false});
  cv.addEventListener('touchend',   e => { e.preventDefault(); tStart=null; S.ducking = false; release(); }, {passive:false});
  cv.addEventListener('mousedown',  e => { e.preventDefault(); press(); });
  addEventListener('mouseup', release);

  // ---- world --------------------------------------------------------------
  function spawn() {
    // Bias toward cacti early; birds only once it's fast enough to be fair.
    const canBird   = S.spd > 420;
    const canBomber = S.spd > 480;
    const r = Math.random();
    const kind = (canBomber && r < 0.22) ? 'bomber'
               : (canBird   && r < 0.50) ? 'bird'
               : 'cactus';
    if (kind === 'bomber') {
      spawnBomber();
      const reach0 = S.spd * 0.62;
      S.nextGap = reach0 * 1.3 + Math.random() * reach0;
      return;
    }
    if (kind === 'bird') {
      // Two heights: duckable, or jumpable-low.
      const low = Math.random() < 0.5;
      S.obs.push({kind, x:W+20, y: low ? GROUND-34 : GROUND-64, w:30, h:20, f:0});
    } else {
      const big = Math.random() < 0.35;
      const n = 1 + (Math.random()<0.3 ? 1 : 0);   // clusters of 1-2
      const w = big ? 22 : 15, h = big ? 42 : 30;
      S.obs.push({kind, x:W+20, y:GROUND-h, w:w*n + (n-1)*4, h, n, cw:w});
    }
    // Gap scales with speed so it stays clearable.
    const reach = S.spd * 0.62;
    S.nextGap = reach + Math.random() * reach * 0.85;
  }

  // Platforms sit at heights a full jump comfortably clears (peak is ~102px).
  // Anything above ~85px is only reachable in a razor-thin timing window, so cap well under.
  // Storeys are spaced so a single jump (peak ~102px) climbs two of them and a
  // double jump reaches ~4 — high enough to feel like climbing, low enough that
  // every tier stays reachable from the one below.
  const STOREY   = 48;
  const MILESTONE = 1000;  // one new storey unlocked per this many points

  // How many storeys are in play right now: grows with score, but never taller
  // than the viewport can actually show above the floor.
  function tiers() {
    const earned = 1 + Math.floor(S.score / MILESTONE);
    const fits   = Math.max(1, Math.floor((GROUND - 90) / STOREY));
    return Math.min(earned, fits);
  }

  // A double jump climbs ~171px, so anything above storey 3 is unreachable in a
  // single leap from the ground. Platforms therefore spawn as connected
  // staircases: each step is at most one storey above the last, so every tier
  // is reached by climbing rather than by one impossible jump.
  function spawnPlat() {
    const n = tiers();
    const top = 1 + Math.floor(Math.pow(Math.random(), 1.6) * n);   // how high this run goes
    const stepW = 74 + Math.random()*46;
    let x = W + 20;

    for (let lvl = 1; lvl <= top; lvl++) {
      const h = lvl * STOREY;
      // Last step of the run gets a wider landing to stand and recover on.
      const w = (lvl === top) ? stepW + 40 + Math.random()*60 : stepW;
      S.plats.push({ x, y:GROUND-h, w, h, lvl });
      // Horizontal gap between steps: comfortably inside a jump's air time.
      x += w + 26 + Math.random()*34;
    }

    // Occasionally perch a cactus on the summit — a reason to move on.
    const summit = S.plats[S.plats.length-1];
    if (summit && Math.random() < 0.3 && summit.w > 130) {
      S.obs.push({kind:'cactus', x:summit.x+summit.w*0.55, y:summit.y-30, w:15, h:30, n:1, cw:15});
    }

    // Space runs out by how long this one was, plus breathing room.
    const runLen = x - (W + 20);
    S.nextPlat = runLen + S.spd*0.8 + Math.random()*S.spd*0.6;
  }

  // Bombers cruise above the skyline and drop bombs on a fuse. They only show
  // up once you're moving fast enough that the extra pressure is earned.
  function spawnBomber() {
    S.obs.push({
      kind:'bomber', x:W+40, y:GROUND-140, w:44, h:16, f:0,
      drop: 0.35 + Math.random()*0.5,   // s until it releases
    });
  }

  function hit(a, b) {
    // Slightly forgiving player hitbox — feels fairer than pixel-exact.
    const px = 40 + 4, pw = (S.ducking ? 38 : 24) - 8;
    const ph = (S.ducking ? 22 : 40) - 6;
    const py = S.y - (S.ducking ? 22 : 40) + 4;
    return px < b.x + b.w && px + pw > b.x && py < b.y + b.h && py + ph > b.y;
  }

  function die() {
    S.state = 'dead'; S.deadT = 0; S.shake = 1;
    if (S.score > S.best) {
      S.best = S.score;
      try { localStorage.setItem('run.best', String(S.score)); } catch {}
    }
    for (let i=0;i<14;i++) S.parts.push({
      x:52, y:S.y-20, vx:(Math.random()-.5)*300, vy:-Math.random()*320, life:1
    });
  }

  // ---- update -------------------------------------------------------------
  function update(dt) {
    S.t += dt;
    for (const c of S.clouds) {
      c.x -= c.s * (S.state==='run' ? S.spd*0.12 : 8) * dt;
      if (c.x < -60) { c.x = W+40; c.y = 20+Math.random()*Math.max(60, GROUND*0.45); }
    }
    for (let i=S.parts.length-1;i>=0;i--) {
      const p = S.parts[i];
      p.vy += GRAV*0.5*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt*1.6;
      if (p.life <= 0) S.parts.splice(i,1);
    }
    if (S.shake > 0) S.shake = Math.max(0, S.shake - dt*3);

    if (S.state === 'dead') { S.deadT += dt; return; }
    if (S.state !== 'run') return;

    S.spd = Math.min(SPD_MAX, S.spd + SPD_ACC*dt);
    S.dashT  = Math.max(0, S.dashT  - dt);
    S.dashCd = Math.max(0, S.dashCd - dt);
    // Dashing pushes the world past faster; that extra distance is the reward.
    const eff = S.spd + (S.dashT > 0 ? DASH_V : 0);
    S.dist += eff*dt;
    S.score = Math.floor(S.dist / 3);

    // jump w/ coyote + buffer
    S.coyote = S.onGround ? COYOTE : Math.max(0, S.coyote - dt);
    S.buffer = Math.max(0, S.buffer - dt);
    if (S.buffer > 0 && S.coyote > 0) {
      S.vy = JUMP_V; S.onGround = false; S.coyote = 0; S.buffer = 0;
    }

    const prevY = S.y;
    S.vy += GRAV*dt;
    S.y  += S.vy*dt;

    // Find the highest surface under the player's feet that we're allowed to land on.
    // One-way platforms: only land when falling and the feet were above the top last frame.
    const pxL = 44, pxR = 44 + (S.ducking ? 30 : 16);
    let surf = GROUND;
    for (const pl of S.plats) {
      if (pxR < pl.x || pxL > pl.x + pl.w) continue;
      if (S.vy >= 0 && prevY <= pl.y + 1 && S.y >= pl.y) surf = Math.min(surf, pl.y);
    }
    S.surf = surf;

    if (S.y >= surf) { S.y = surf; S.vy = 0; S.onGround = true; S.jumps = 0; }
    else S.onGround = false;
    // Walked off a ledge: start falling from where we stood (coyote time still applies).
    if (!S.onGround && S.vy === 0) S.vy = 1;

    // New storey unlocked?
    const nt = tiers();
    if (nt > S.tier) { S.tier = nt; S.tierMsg = 1.6; }
    S.tierMsg = Math.max(0, S.tierMsg - dt);

    S.nextGap  -= eff*dt;
    S.nextPlat -= eff*dt;
    if (S.nextGap <= 0) spawn();
    if (S.nextPlat <= 0) spawnPlat();

    for (let i=S.bombs.length-1;i>=0;i--) {
      const b = S.bombs[i];
      b.vy += GRAV*0.55*dt;
      b.y  += b.vy*dt;
      b.x  -= eff*dt;

      // Bombs burst on whatever surface is under them (platform top or ground).
      let floor = GROUND;
      for (const pl of S.plats) if (b.x > pl.x && b.x < pl.x+pl.w) floor = Math.min(floor, pl.y);

      const box = {x:b.x-b.r, y:b.y-b.r, w:b.r*2, h:b.r*2};
      if (S.dashT <= 0 && hit(S, box)) { die(); S.bombs.splice(i,1); continue; }

      if (b.y >= floor || b.x < -20) {
        if (b.x >= -20) {
          S.shake = Math.max(S.shake, .7);
          for (let k=0;k<12;k++) S.parts.push({
            x:b.x, y:floor-2, vx:(Math.random()-.5)*260, vy:-Math.random()*260,
            life:.6, c:'#ff9f45'
          });
          // The blast itself is lethal for a moment.
          S.blasts.push({x:b.x, y:floor, r:4, life:.22});
        }
        S.bombs.splice(i,1);
      }
    }

    for (let i=S.blasts.length-1;i>=0;i--) {
      const bl = S.blasts[i];
      bl.life -= dt; bl.r += dt*150; bl.x -= eff*dt;
      if (bl.life <= 0) { S.blasts.splice(i,1); continue; }
      const box = {x:bl.x-bl.r, y:bl.y-bl.r*0.7, w:bl.r*2, h:bl.r*0.7};
      if (S.dashT <= 0 && hit(S, box)) die();
    }

    for (let i=S.plats.length-1;i>=0;i--) {
      const pl = S.plats[i];
      pl.x -= eff*dt;
      if (pl.x + pl.w < -30) S.plats.splice(i,1);
    }

    for (let i=S.obs.length-1;i>=0;i--) {
      const o = S.obs[i];
      o.x -= eff*dt;
      if (o.kind==='bird') o.f += dt*10;
      if (o.kind==='bomber') {
        o.f += dt*6;
        o.drop -= dt;
        if (o.drop <= 0 && o.x > 60 && o.x < W) {
          o.drop = 0.9 + Math.random()*0.8;
          S.bombs.push({x:o.x+18, y:o.y+14, vy:60, r:6});
        }
      }
      if (o.x + o.w < -30) { S.obs.splice(i,1); continue; }
      if (S.dashT <= 0 && hit(S, o)) die();
    }

  }

  // ---- draw ---------------------------------------------------------------
  const px = (x,y,w,h,c) => { ctx.fillStyle=c; ctx.fillRect(x|0,y|0,w|0,h|0); };

  function drawRunner() {
    const c = S.dashT > 0 ? '#7cf03d' : '#e8e8ef';
    if (S.dashT > 0) {
      ctx.globalAlpha = 0.35;
      for (let i=1;i<=3;i++) px(40-i*13, S.y-(S.ducking?22:40), S.ducking?38:24, S.ducking?22:40, '#7cf03d');
      ctx.globalAlpha = 1;
    }
    const bob = S.onGround && S.state==='run' ? (Math.sin(S.t*18)>0?1:0) : 0;
    if (S.ducking) {
      px(40, S.y-22, 38, 22, c);
      px(70, S.y-20, 8, 8, '#111117');           // eye-ish notch
      px(44, S.y-2, 10, 2, c); px(60, S.y-2, 10, 2, c);
    } else {
      px(40, S.y-40, 24, 26, c);                 // body/head
      px(56, S.y-34, 6, 6, '#111117');           // eye
      px(40, S.y-14, 8, 14+(bob?0:0), c);        // legs
      px(54, S.y-14, 8, 14, c);
      if (S.onGround && S.state==='run') {
        px(40, S.y-14+ (bob?6:0), 8, 8, '#111117');
        px(54, S.y-14+ (bob?0:6), 8, 8, '#111117');
      }
    }
  }

  function drawObs(o) {
    if (o.kind === 'cactus') {
      for (let i=0;i<(o.n||1);i++){
        const x = o.x + i*(o.cw+4);
        px(x + o.cw/2 - 3, o.y, 6, o.h, '#4c9a2a');
        px(x, o.y + o.h*0.30, 4, 10, '#4c9a2a');
        px(x + o.cw - 4, o.y + o.h*0.45, 4, 10, '#4c9a2a');
      }
    } else if (o.kind === 'bomber') {
      const bob = Math.sin(o.f) * 2;
      // fuselage
      px(o.x,      o.y+4+bob, 44, 10, '#8a8aa0');
      px(o.x+34,   o.y+2+bob, 10,  7, '#a8a8c0');   // nose
      px(o.x+6,    o.y+0+bob, 20,  4, '#6a6a86');   // wing
      px(o.x+2,    o.y+13+bob, 8,  4, '#6a6a86');   // tail fin
      px(o.x+38,   o.y+6+bob,  3,  3, '#ff4d6d');   // cockpit glint
      // bomb bay glows just before release
      if (o.drop < 0.22) px(o.x+16, o.y+13+bob, 6, 4, '#ff9f45');
    } else {
      const up = Math.sin(o.f) > 0;
      px(o.x+8, o.y+6, 16, 6, '#c9c9d6');
      px(o.x+22, o.y+4, 6, 5, '#c9c9d6');
      px(o.x+2, up ? o.y : o.y+11, 12, 5, '#c9c9d6');
    }
  }

  function draw() {
    ctx.save();
    if (S.shake > 0) ctx.translate((Math.random()-.5)*6*S.shake, (Math.random()-.5)*6*S.shake);
    ctx.clearRect(-10,-10,W+20,H+20);
    px(-10,-10,W+20,H+20,'#111117');

    for (const c of S.clouds) { px(c.x, c.y, 26, 5, '#1b1b25'); px(c.x+7, c.y-4, 14, 5, '#1b1b25'); }

    px(0, GROUND, W, 2, '#2e2e3c');
    // speckled ground, scrolls with distance
    ctx.fillStyle = '#23232e';
    const specks = Math.ceil(W / 19);
    for (let i=0;i<specks;i++){
      const x = ((i*137.5 - S.dist*0.6) % (W+40) + W+40) % (W+40) - 20;
      ctx.fillRect(x|0, GROUND + 8 + ((i*7)%14), 3, 2);
    }

    for (const pl of S.plats) {
      // Every platform is a structure standing on the ground, not a floating
      // slab: a dim masonry body carries it down to the floor, with a lit deck
      // on top. The body is scenery you run straight through — only the deck is
      // solid — so it's drawn dark enough to read as background, never as a wall.
      const bodyTop = pl.y + 5;
      const bodyH   = GROUND - bodyTop;
      if (bodyH > 0) {
        px(pl.x + 3, bodyTop, pl.w - 6, bodyH, '#15151d');          // solid mass
        px(pl.x + 3, bodyTop, 1, bodyH, '#1e1e28');                 // edge highlight
        px(pl.x + pl.w - 4, bodyTop, 1, bodyH, '#1e1e28');
        // window slits, so it reads as a building rather than a block
        for (let wy = bodyTop + 12; wy < GROUND - 10; wy += 22) {
          for (let wx = pl.x + 10; wx < pl.x + pl.w - 12; wx += 20) {
            px(wx, wy, 5, 6, '#1b1b26');
          }
        }
      }
      // deck
      px(pl.x, pl.y, pl.w, 3, '#4a4a5e');
      px(pl.x, pl.y+3, pl.w, 2, '#2a2a38');
    }
    for (const b of S.bombs) {
      px(b.x-4, b.y-5, 8, 10, '#e8e8ef');
      px(b.x-2, b.y-8, 4, 3, '#6a6a7a');            // fin
      px(b.x-1, b.y-11, 2, 3, '#ff9f45');           // fuse spark
    }
    for (const bl of S.blasts) {
      ctx.globalAlpha = Math.max(0, bl.life / 0.22);
      px(bl.x-bl.r, bl.y-bl.r*0.7, bl.r*2, bl.r*0.7, '#ff9f45');
      ctx.globalAlpha = 1;
    }
    for (const o of S.obs) drawObs(o);
    for (const p of S.parts) { ctx.globalAlpha = Math.max(0,p.life); px(p.x,p.y,4,4,p.c||'#e8e8ef'); }
    ctx.globalAlpha = 1;

    if (S.state !== 'dead') drawRunner();

    // Dash cooldown, pinned just above the runner's head so it's read without
    // looking away from the action.
    if (S.state === 'run') {
      const bw = 30, bx = 40 + (24-bw)/2;
      const by = S.y - (S.ducking ? 22 : 40) - 12;
      const f  = Math.max(0, Math.min(1, 1 - (S.dashCd / DASH_CD)));
      px(bx, by, bw, 3, '#23232e');
      px(bx, by, bw*f, 3, f >= 1 ? '#7cf03d' : '#5a5a70');
      if (f >= 1) px(bx-3, by, 2, 3, '#7cf03d');   // little "ready" tick
    }

    ctx.fillStyle = '#6a6a7a';
    ctx.font = '600 15px ui-monospace,Menlo,monospace';
    ctx.textAlign = 'right';
    ctx.fillText(String(S.score).padStart(5,'0'), W-20, 34);
    if (S.best > 0) { ctx.fillStyle='#3d3d4c'; ctx.fillText('HI '+String(S.best).padStart(5,'0'), W-110, 34); }
    if (S.state === 'run') {
      ctx.fillStyle = '#3d3d4c'; ctx.font = '600 11px ui-monospace,Menlo,monospace';
      ctx.fillText('STOREYS ' + S.tier, W-20, 52);
    }



    ctx.textAlign = 'center';
    if (S.tierMsg > 0 && S.state === 'run') {
      ctx.globalAlpha = Math.min(1, S.tierMsg / 0.4);
      ctx.fillStyle = '#7cf03d';
      ctx.font = '600 15px ui-monospace,Menlo,monospace';
      ctx.fillText('STOREY ' + S.tier + ' UNLOCKED', W/2, 64);
      ctx.globalAlpha = 1;
    }
    if (S.state === 'ready') {
      ctx.fillStyle = '#e8e8ef'; ctx.font = '600 16px ui-monospace,Menlo,monospace';
      ctx.fillText('press space to run', W/2, H/2 - 6);
    } else if (S.state === 'dead' && S.deadT > .35) {
      ctx.fillStyle = '#ff4d6d'; ctx.font='600 18px ui-monospace,Menlo,monospace';
      ctx.fillText('dead', W/2, H/2 - 14);
      ctx.fillStyle = '#6a6a7a'; ctx.font='600 12px ui-monospace,Menlo,monospace';
      ctx.fillText(S.score >= S.best && S.score>0 ? 'new best · press space' : 'press space', W/2, H/2 + 8);
    }
    ctx.restore();
  }

  // ---- loop ---------------------------------------------------------------
  let last = performance.now();
  function frame(now) {
    // Clamp dt so a backgrounded tab doesn't teleport the player into a cactus.
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt); draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
