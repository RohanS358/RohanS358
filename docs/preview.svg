<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200" role="img" aria-label="RUN — an endless runner with platforms">
  <rect width="760" height="200" rx="10" fill="#111117"/>
  <rect x="0.5" y="0.5" width="759" height="199" rx="10" fill="none" stroke="#23232e"/>

  <!-- clouds -->
  <g fill="#1b1b25">
    <rect x="120" y="34" width="26" height="5"/><rect x="127" y="30" width="14" height="5"/>
    <rect x="410" y="58" width="26" height="5"/><rect x="417" y="54" width="14" height="5"/>
    <rect x="640" y="26" width="26" height="5"/><rect x="647" y="22" width="14" height="5"/>
  </g>

  <!-- platforms -->
  <g>
    <rect x="250" y="94" width="150" height="3" fill="#3d3d4c"/>
    <rect x="250" y="97" width="150" height="2" fill="#23232e"/>
    <rect x="258" y="99" width="2" height="51" fill="#1b1b25"/>
    <rect x="310" y="99" width="2" height="51" fill="#1b1b25"/>
    <rect x="362" y="99" width="2" height="51" fill="#1b1b25"/>

    <rect x="500" y="108" width="110" height="3" fill="#3d3d4c"/>
    <rect x="500" y="111" width="110" height="2" fill="#23232e"/>
    <rect x="510" y="113" width="2" height="37" fill="#1b1b25"/>
    <rect x="562" y="113" width="2" height="37" fill="#1b1b25"/>
  </g>

  <!-- ground -->
  <rect x="0" y="150" width="760" height="2" fill="#2e2e3c"/>
  <g fill="#23232e">
    <rect x="40" y="160" width="3" height="2"/><rect x="180" y="166" width="3" height="2"/>
    <rect x="330" y="158" width="3" height="2"/><rect x="470" y="168" width="3" height="2"/>
    <rect x="620" y="162" width="3" height="2"/><rect x="700" y="159" width="3" height="2"/>
    <rect x="110" y="171" width="3" height="2"/><rect x="255" y="163" width="3" height="2"/>
    <rect x="545" y="157" width="3" height="2"/>
  </g>

  <!-- cacti -->
  <g fill="#4c9a2a">
    <rect x="176" y="120" width="6" height="30"/><rect x="170" y="129" width="4" height="10"/><rect x="181" y="134" width="4" height="10"/>
    <rect x="668" y="108" width="6" height="42"/><rect x="660" y="121" width="4" height="10"/><rect x="674" y="127" width="4" height="10"/>
    <rect x="330" y="64" width="6" height="30"/><rect x="324" y="73" width="4" height="10"/><rect x="335" y="78" width="4" height="10"/>
  </g>

  <!-- bird -->
  <g fill="#c9c9d6">
    <rect x="438" y="66" width="16" height="6"/><rect x="452" y="64" width="6" height="5"/><rect x="432" y="60" width="12" height="5"/>
  </g>

  <!-- runner, mid-jump toward the first platform -->
  <g transform="translate(0,-46)">
    <rect x="70" y="110" width="24" height="26" fill="#e8e8ef"/>
    <rect x="86" y="116" width="6" height="6" fill="#111117"/>
    <rect x="70" y="136" width="8" height="14" fill="#e8e8ef"/>
    <rect x="84" y="136" width="8" height="14" fill="#e8e8ef"/>
  </g>

  <text x="24" y="30" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#3d3d4c" letter-spacing="4">RUN</text>
  <text x="736" y="30" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#6a6a7a">01337</text>
</svg>
